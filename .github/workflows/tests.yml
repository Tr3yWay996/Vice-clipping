name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run i18n:check
      - run: npm run typecheck
      - run: npm run build

  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests

  native-audio:
    runs-on: ubuntu-latest
    container: debian:trixie-slim
    steps:
      - name: Install isolated audio test runtime
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates python3-venv pipewire pipewire-pulse wireplumber pulseaudio-utils libpulse0 ffmpeg dbus-daemon
      - uses: actions/checkout@v4
      - name: Test real PCM routing without a desktop or GPU
        run: |
          python3 -m venv /tmp/vice-audio-venv
          /tmp/vice-audio-venv/bin/pip install tomli-w psutil
          useradd --create-home vice-audio-test
          runuser -u vice-audio-test -- /tmp/vice-audio-venv/bin/python tools/test-smart-audio.py
